# When a release is published with a tag such as v0.11.1, GitHub itself runs the tests, builds the
# add-on zip from that tagged source, and attaches the zip and its SHA256 checksum to the release.
# So the zip you download from a release is built in public from the code you can read here.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        run: python3 tests/run_tests.py
      - name: Check the tag matches the add-on version
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('plugin.video.tvboxsets/addon.xml').getroot().get('version'))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the add-on version v$version in addon.xml"
            exit 1
          fi
      - name: Build the add-on zip
        run: python3 tools/build_zip.py
      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip | tee SHA256SUMS
      - name: Write the release notes
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --title "TV Boxsets ${GITHUB_REF_NAME#v} (alpha)" \
            --notes-file release-notes.md
