# When a version tag such as v0.11.2 is pushed (from GitHub Desktop) or created by publishing a release
# on the web page, GitHub itself runs the tests, builds the add-on zip from that tagged source, and
# attaches the zip and its SHA256 checksum to the release. So the zip you download from a release is
# built in public from the code you can read here.
#
# It can also be run by hand for a tag that already exists: Actions > Release > Run workflow.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the release for, for example v0.11.2"
        required: true

permissions:
  contents: write

env:
  # the version of the small "repository" add-on people install once. Raise it only if the Pages address changes.
  REPO_VERSION: "1.2.0"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (used by the collage tests only)
        run: pip install pillow
      - name: Run the tests
        run: python3 tests/run_tests.py
      - name: Check the tag matches the add-on version
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('plugin.video.tvboxsets/addon.xml').getroot().get('version'))")
          if [ "v$version" != "$TAG" ]; then
            echo "The tag $TAG does not match the add-on version v$version in addon.xml"
            exit 1
          fi
      - name: Build the add-on zip
        run: python3 tools/build_zip.py
      - name: Build the Kodi repository (the update channel)
        run: |
          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')
          python3 tools/make_repo.py \
            --addon-zip "dist/plugin.video.tvboxsets-${TAG#v}.zip" \
            --base-url "https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/" \
            --repo-version "$REPO_VERSION" --out site
      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip | tee SHA256SUMS
      - name: Write the release notes
        run: python3 tools/release_notes.py "${TAG#v}" > release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="TV Boxsets ${TAG#v} (alpha)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # the release already exists (for example it was published on the web page): add the files to it
            gh release upload "$TAG" dist/*.zip site/repository.tvboxsets-*.zip dist/SHA256SUMS --clobber
            gh release edit "$TAG" --title "$title" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/*.zip site/repository.tvboxsets-*.zip dist/SHA256SUMS --title "$title" --notes-file release-notes.md
          fi
      - name: Publish the repository to GitHub Pages (the gh-pages branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Repository for ${TAG}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
